<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">

<button id="theme-toggle" class="icon-btn login-page__theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
  <svg class="icon icon--sun" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6"/>
    <path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
  <svg class="icon icon--moon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>
</button>

<main class="login">
  <div class="tile login-card">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="9" height="9" rx="2" fill="var(--accent)"/>
          <rect x="12" y="1" width="9" height="9" rx="2" fill="var(--gold)"/>
          <rect x="1" y="12" width="9" height="9" rx="2" fill="var(--gold)"/>
          <rect x="12" y="12" width="9" height="9" rx="2" fill="var(--accent)"/>
        </svg>
      </span>
      <span class="brand__name">Ledger</span>
    </div>

    <h1>Welcome back</h1>
    <p class="login-card__subtitle">Sign in to see your household spending</p>

    <button id="google-signin" class="google-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62Z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.36 0-4.36-1.6-5.08-3.74H.9v2.33A9 9 0 0 0 9 18Z" fill="#34A853"/>
        <path d="M3.92 10.68A5.4 5.4 0 0 1 3.63 9c0-.58.1-1.15.29-1.68V4.99H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.01l3.02-2.33Z" fill="#FBBC05"/>
        <path d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.99l3.02 2.33C4.64 5.18 6.64 3.58 9 3.58Z" fill="#EA4335"/>
      </svg>
      <span>Sign in with Google</span>
    </button>

    <p class="login-card__error" id="login-error" role="alert"></p>

    <p class="login-card__footnote">Private household ledger — access is limited to invited accounts.</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

    const button = document.getElementById('google-signin');
    const errorEl = document.getElementById('login-error');

    if (new URLSearchParams(window.location.search).get('error') === 'permission_denied') {
      errorEl.textContent = 'Permission not granted.';
      window.history.replaceState({}, '', 'login.html');
    }

    button.addEventListener('click', async () => {
      button.disabled = true;
      errorEl.textContent = '';

      const { error } = await signInWithGoogle();

      if (error) {
        console.error('[Ledger auth] Google sign-in failed:', error);
        errorEl.textContent = 'Sign-in failed. Please try again.';
        button.disabled = false;
      }
      // On success the browser is redirected to Google, then back to
      // index.html, so there's nothing further to do here.
    });
  });
</script>
</body>
</html>
