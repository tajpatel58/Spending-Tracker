<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<!-- interactive-widget lets supporting browsers shrink the layout for the on-screen keyboard;
     chat.js also tracks the visual viewport for iOS Safari, which doesn't. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Ledger — Assistant</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<!-- Add to Home Screen opens it as a full-screen app (no Safari bars). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="application-name" content="Ledger">
<!-- Browser/status bar colour; theme.js keeps it in step with light/dark mode. -->
<meta name="theme-color" content="#F5F6F9">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<!-- Scripts download in parallel while the page parses (defer keeps their order). -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script defer src="js/config.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/theme.js"></script>
<script defer src="js/motion.js"></script>
<script defer src="js/chat.js"></script>
</head>
<body class="chat-page">

<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="9" height="9" rx="2" fill="var(--accent)"/>
          <rect x="12" y="1" width="9" height="9" rx="2" fill="var(--gold)"/>
          <rect x="1" y="12" width="9" height="9" rx="2" fill="var(--gold)"/>
          <rect x="12" y="12" width="9" height="9" rx="2" fill="var(--accent)"/>
        </svg>
      </span>
      <span class="brand__name">Ledger</span>
    </div>

    <nav class="view-nav" aria-label="Views">
      <a href="index.html" class="view-nav__link">
        <svg class="view-nav__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="4" y="4" width="7" height="7" rx="1.8" stroke="currentColor" stroke-width="1.7"/>
          <rect x="13" y="4" width="7" height="7" rx="1.8" stroke="currentColor" stroke-width="1.7"/>
          <rect x="4" y="13" width="7" height="7" rx="1.8" stroke="currentColor" stroke-width="1.7"/>
          <rect x="13" y="13" width="7" height="7" rx="1.8" stroke="currentColor" stroke-width="1.7"/>
        </svg>
        <span>Overview</span>
      </a>
      <a href="calendar.html" class="view-nav__link">
        <svg class="view-nav__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="4" y="5.5" width="16" height="14.5" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M4 10h16M8.5 3.5v4M15.5 3.5v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Calendar</span>
      </a>
      <a href="chat.html" class="view-nav__link is-active" aria-current="page">
        <svg class="view-nav__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3.5l1.6 4.3a3 3 0 0 0 1.8 1.8l4.1 1.4-4.1 1.4a3 3 0 0 0-1.8 1.8L12 18.5l-1.6-4.3a3 3 0 0 0-1.8-1.8L4.5 11l4.1-1.4a3 3 0 0 0 1.8-1.8L12 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M18.5 16.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6.6-1.4Z" fill="currentColor"/>
        </svg>
        <span>Assistant</span>
      </a>
    </nav>

    <div class="topbar__controls">

      <div class="topbar__actions">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="icon icon--sun" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <svg class="icon icon--moon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="user-menu" id="user-menu">
          <button class="user-menu__button" id="user-menu-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu-panel">
            <span class="user-menu__avatar" id="user-menu-avatar" aria-hidden="true"></span>
            <span class="user-menu__name" id="user-menu-name"></span>
            <svg width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true">
              <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="user-menu__panel" id="user-menu-panel" role="menu" hidden>
            <div class="user-menu__identity">
              <span class="user-menu__panel-name" id="user-menu-panel-name"></span>
              <span class="user-menu__email" id="user-menu-email"></span>
            </div>
            <div class="user-menu__divider"></div>
            <button id="signout-button" class="user-menu__signout" type="button" role="menuitem">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 12H10.5M20 12l-3.5-3.5M20 12l-3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Sign out</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- ============ ASSISTANT ============ -->
<main class="chat" aria-label="Spending assistant">
  <div class="chat__scroll" id="chat-scroll">
    <!-- Shown until the first message is sent. -->
    <section class="chat__welcome" id="chat-welcome">
      <span class="chat__welcome-mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M12 3.5l1.6 4.3a3 3 0 0 0 1.8 1.8l4.1 1.4-4.1 1.4a3 3 0 0 0-1.8 1.8L12 18.5l-1.6-4.3a3 3 0 0 0-1.8-1.8L4.5 11l4.1-1.4a3 3 0 0 0 1.8-1.8L12 3.5Z" fill="currentColor"/>
        </svg>
      </span>
      <h1 class="chat__welcome-title" id="chat-greeting">What would you like to know?</h1>
      <p class="chat__welcome-sub">Ask about your spending, budgets and forecasts.</p>
      <div class="chat__suggestions" id="chat-suggestions">
        <button type="button" class="chat__suggestion"><strong>How much did I spend</strong><span>on dining out this month?</span></button>
        <button type="button" class="chat__suggestion"><strong>Am I on track</strong><span>for my £4,400 savings target?</span></button>
        <button type="button" class="chat__suggestion"><strong>What changed</strong><span>compared with last month?</span></button>
        <button type="button" class="chat__suggestion"><strong>Where can I cut back</strong><span>without touching fixed costs?</span></button>
      </div>
    </section>

    <div class="chat__thread" id="chat-thread" role="log" aria-live="polite" aria-label="Conversation"></div>
  </div>

  <div class="chat__dock">
    <form class="composer" id="chat-form" autocomplete="off">
      <label class="visually-hidden" for="chat-input">Message</label>
      <textarea id="chat-input" class="composer__input" rows="1" placeholder="Ask about your spending…" enterkeyhint="enter"></textarea>
      <div class="composer__bar">
        <button type="button" class="composer__new" id="chat-new" title="New chat" hidden>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>New chat</span>
        </button>
        <button type="submit" class="composer__send" id="chat-send" aria-label="Send message" disabled>
          <svg class="composer__send-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="composer__stop-icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg>
        </button>
      </div>
    </form>
    <p class="chat__disclaimer">The assistant can make mistakes — double-check important numbers.</p>
  </div>
</main>

<!-- Only the scripts the assistant needs: auth (session + user menu), theme, and the chat itself. -->
</body>
</html>
