name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Generated here instead of committed, so the real key never lives in the repo/history.
      - name: Generate dashboard/js/config.js from secrets
        run: |
          cat > dashboard/js/config.js <<EOF
          const SUPABASE_URL = '${{ secrets.SUPABASE_URL }}';
          const SUPABASE_ANON_KEY = '${{ secrets.SUPABASE_ANON_KEY }}';
          EOF

      # Lets each page open its connection to Supabase while the scripts are
      # still downloading (the URL is only known here, from the secrets).
      - name: Add Supabase preconnect to the pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          origin=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          sed -i "s#<!-- supabase-preconnect -->#<link rel=\"preconnect\" href=\"${origin}\" crossorigin>#" dashboard/*.html
          grep -c 'rel="preconnect" href="https://[^"]*supabase' dashboard/*.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
